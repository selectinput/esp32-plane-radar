; ESP32-C3 + 1.28" round GC9A01 (240×240). Two supported boards:
;   env:supermini — ESP32-C3 Super Mini (Arduino IDE: "ESP32C3 Dev Module")
;   env:xiao      — Seeed Studio XIAO ESP32-C3
; Pin mapping is selected at build time via -DBOARD_* (see include/config.h).

[common]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:supermini]
extends = common
board = esp32-c3-devkitm-1

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
  -DBOARD_SUPERMINI

[env:xiao]
extends = common
board = seeed_xiao_esp32c3

; USB serial over USB-C (XIAO native USB)
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
  -DBOARD_XIAO
